# =============================================================================
# IntelliFlow CRM - SonarQube Project Configuration
# =============================================================================

# Project identification (SonarQube Cloud — talyssonoliver org)
sonar.projectKey=talyssonoliver_IntelliFlow-CRM
sonar.organization=talyssonoliver
sonar.projectName=IntelliFlow CRM
# The main branch's New Code definition is "previous version": code counts as
# new since the analysis where this version last changed. It stood at 0.1.0
# from 2026-06-03, so when scripts/ and tools/ joined sonar.sources (#757,
# #765) four months of existing tooling counted as "new" and failed main's
# gate. 0.2.0 (2026-10-05, owner decision) starts a new window at this
# analysis; tooling is held to the full gate from here. The tooling bugs and
# vulnerabilities found in the old window are fixed in their own PR. Bump this
# deliberately, at a real baseline, never to make a gate pass.
sonar.projectVersion=0.2.0

# Host: SonarQube Cloud (https://sonarcloud.io) is selected automatically by the
# presence of `sonar.organization` above — do NOT set sonar.host.url here, or the
# scanner targets a self-hosted server. For LOCAL self-hosted SonarQube runs
# (docker-compose.sonarqube.yml) set SONAR_HOST_URL=http://localhost:9000 in
# .env.local instead of pinning it in this committed file.
# sonar.host.url=http://localhost:9000

# Authentication (token loaded from environment or .env.local)
# sonar.token=<your-token-here>

# Source code paths
# Keep this list source-only to avoid scanning runtime/build outputs (e.g. `.next/`).
#
# `scripts` and `tools` are the repo's own tooling (pre-ship gate, coverage merge,
# attestation, audit linters, CI helpers). Until they were listed here Sonar never
# analysed them, so a PR whose logic lived there passed new_coverage on zero
# coverable lines (PR #754: new_lines=68, new_lines_to_cover=0). Their
# JavaScript/TypeScript and Python are in scope; every other file type under them
# is excluded in sonar.exclusions below. Python coverage comes from
# scripts/run-python-coverage.mjs (#755). Existing tooling debt does not fail the
# gate, which judges new code only; new tooling lines must meet new_coverage like
# product lines.
#
# scripts/check-diff-coverage.mjs reads sonar.sources, sonar.exclusions and
# sonar.coverage.exclusions from THIS file, so pre-ship's diff-coverage gate and
# Sonar always agree on scope. Edit scope here only.
sonar.sources=\
  apps/api/src,\
  apps/ai-worker/src,\
  apps/web/src,\
  apps/project-tracker/app,\
  apps/project-tracker/components,\
  apps/project-tracker/lib,\
  packages/adapters/src,\
  packages/api-client/src,\
  packages/application/src,\
  packages/db/src,\
  packages/domain/src,\
  packages/observability/src,\
  packages/platform/src,\
  packages/ui/src,\
  packages/validators/src,\
  scripts,\
  tools

# Tests are validated separately via CI; keep Sonar's test roots minimal to avoid
# traversing runtime/build output directories under apps/.
sonar.tests=tests

# File inclusions/exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.next/**,\
  **/coverage/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/migrations/**,\
  **/*.config.js,\
  **/*.config.ts,\
  **/*.config.mjs,\
  **/*.config.cjs,\
  apps/web/src/components/sidebar/sidebar-types.ts,\
  scripts/**/__tests__/**,\
  tools/**/__tests__/**,\
  tools/**/fixtures/**,\
  **/*.test.js,\
  **/*.test.mjs,\
  **/*.test.cjs,\
  **/*.spec.js,\
  **/*.spec.mjs,\
  **/*.spec.cjs,\
  tools/**/tests/**,\
  **/conftest.py,\
  **/test_*.py,\
  tools/**/*.ipynb,\
  scripts/**/*.sh,\
  tools/**/*.sh,\
  scripts/**/*.ps1,\
  tools/**/*.ps1,\
  tools/**/*.sql,\
  tools/**/*.yaml,\
  tools/**/*.yml,\
  tools/**/*.json,\
  tools/**/*.toml,\
  scripts/**/*.md,\
  tools/**/*.md,\
  scripts/**/*.csv,\
  tools/**/*.csv,\
  tools/**/*.txt,\
  tools/**/*.woff2

sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Language-specific settings
# Merged coverage is written to artifacts/coverage/lcov.info by
# scripts/run-coverage.js (pnpm test:coverage).  TDD watch-mode Vitest
# writes to artifacts/coverage-vitest/ so it never overwrites the merged data.
sonar.javascript.lcov.reportPaths=artifacts/coverage/lcov.info
sonar.typescript.lcov.reportPaths=artifacts/coverage/lcov.info
# Python tooling coverage (#755): Cobertura with repo-relative paths, written by
# scripts/run-python-coverage.mjs in CI's SonarCloud job and in pre-ship.
sonar.python.coverage.reportPaths=artifacts/coverage/python-coverage.xml
sonar.python.version=3.11

# Increase Node.js heap for the JS/TS sensor (default 4288 MB is too low for this repo).
# The OS has ~64 GB; 8192 MB gives the sensor enough room to analyse all 1500+ files.
sonar.javascript.node.maxspace=8192

# Code coverage
# scripts/check-diff-coverage.mjs, scripts/check-coverage-floor.mjs and
# scripts/run-python-coverage.mjs are thin CLI entry points (wire
# processes/git/fs/exit into scripts/lib/*.mjs, which is tested in-process
# and measured). Their tests can only spawn them, which Istanbul cannot see. Tooling
# policy: logic goes in an importable module with in-process tests; only an entry
# point that does nothing but argv/IO/exit wiring may be listed here.
# Also excluded: tooling re-export barrels and type-only modules (no executable
# lines, so they never reach lcov and the local gate would score edits 0%), and
# the k6 scenarios in tools/scripts/k6/*.js, which run only inside the k6 runtime
# (`import http from 'k6/http'`) and cannot be loaded by Node; their shared logic
# lives in tools/scripts/k6/lib/, which is measured.
# Test helpers under __tests__/ and __mocks__/ (e.g. deal-test-utils.tsx) are test
# code: Vitest never instruments them and the local gate never counts them, but
# Sonar scored them as uncovered source (0% of their lines). They stay analysed
# for issues; only the coverage expectation is dropped.
sonar.coverage.exclusions=\
  **/__tests__/**,\
  **/__mocks__/**,\
  scripts/check-diff-coverage.mjs,\
  scripts/check-coverage-floor.mjs,\
  scripts/run-python-coverage.mjs,\
  tools/scripts/lib/code-review/index.ts,\
  tools/scripts/lib/schemas/index.ts,\
  tools/scripts/lib/sprint-audit/index.ts,\
  tools/scripts/lib/stoa/index.ts,\
  tools/scripts/lib/workflow/index.ts,\
  tools/scripts/lib/workflow/types.ts,\
  tools/scripts/k6/*.js,\
  tools/scripts/k6/*.mjs,\
  tools/lighthouse/lhci-auth.js,\
  scripts/pre-ship.mjs,\
  **/*.stories.tsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.config.ts,\
  **/*.config.js,\
  **/migrations/**,\
  apps/api/src/tracing/example.ts,\
  apps/project-tracker/app/api/**,\
  apps/project-tracker/components/**,\
  apps/project-tracker/lib/data-sync.ts,\
  apps/project-tracker/lib/data-sync/**,\
  apps/ai-worker/src/index.ts,\
  packages/domain/src/crm/contact/ContactRepository.ts,\
  packages/application/src/ports/external/PortalDeliverySyncPort.ts,\
  apps/web/src/app/**/page.tsx,\
  apps/api/src/shared/**,\
  apps/api/src/lib/supabase.ts,\
  apps/api/src/context.ts,\
  apps/api/src/modules/legal/*.router.ts,\
  apps/api/src/test/**,\
  apps/api/src/router.ts,\
  apps/web/src/app/**/layout.tsx,\
  apps/web/src/lib/auth/AuthContext.tsx,\
  apps/web/src/components/navigation.tsx,\
  packages/ui/src/components/rich-text-editor.tsx,\
  packages/ui/src/components/index.ts,\
  packages/adapters/src/external/index.ts,\
  apps/web/src/app/**/loading.tsx,\
  apps/web/src/test/**,\
  apps/web/src/components/legal/TermsAcceptanceConfirm.tsx,\
  packages/domain/src/legal/TermsAcceptance.ts,\
  packages/domain/src/index.ts,\
  packages/validators/src/terms-acceptance.ts,\
  packages/validators/src/index.ts,\
  packages/db/src/index.ts,\
  packages/adapters/src/index.ts,\
  packages/application/src/ports/index.ts,\
  packages/application/src/ports/TransactionPort.ts,\
  packages/application/src/ports/external/EventBusPort.ts,\
  packages/domain/src/shared/RepositoryTransaction.ts,\
  packages/domain/src/crm/account/AccountRepository.ts,\
  packages/domain/src/crm/lead/LeadRepository.ts,\
  packages/domain/src/crm/opportunity/OpportunityRepository.ts,\
  packages/application/src/ports/repositories/HelpArticleAnalyticsRepositoryPort.ts,\
  packages/application/src/ports/repositories/index.ts,\
  packages/adapters/src/repositories/index.ts

# Duplication (CPD) exclusions — apps/api/src/shared/** holds mechanical field-by-field
# response mappers (mapLeadToResponse etc.). They share field names with the Prisma
# persistence mappers by nature (same domain entity, different layer/shape), so CPD flags
# the BANT/Lead-360 mapping blocks as cross-file duplicates. Forcing DRY across an API
# response mapper and a repository persistence mapper would be wrong; exclude this
# boilerplate from duplication, consistent with its coverage exclusion above (IFC-242 / #382).
sonar.cpd.exclusions=\
  apps/api/src/shared/**

# Source encoding
sonar.sourceEncoding=UTF-8

# Analysis parameters
sonar.scm.disabled=false
sonar.scm.provider=git

# Quality gate settings
sonar.qualitygate.wait=false

# Sonar rule suppressions (kept narrow and explicit)
sonar.issue.ignore.multicriteria=tableHeader,cssAtRuleWeb,cssAtRuleTracker,rechartsCellSentiment,rechartsCellNps,rechartsCellDeals,execCommand,trpcSubscription,toolingPathJsScripts,toolingPathJsTools,toolingPathTsScripts,toolingPathTsTools
# S4036 ("PATH should only contain fixed, unwriteable directories") flags every
# command run by name. Repo tooling (scripts/, tools/) runs `git`, `pnpm` and
# `node` by name by design, on developer and CI machines whose PATH the project
# controls; resolving absolute paths for each would be Windows-fragile noise.
# Owner decision 2026-10-04: ignore S4036 for tooling ONLY. App code under
# apps/ and packages/ stays fully gated (scripts/__tests__/sonar-scope.test.ts
# fails if any of these resource keys leaves scripts/ or tools/).
sonar.issue.ignore.multicriteria.toolingPathJsScripts.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.toolingPathJsScripts.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.toolingPathJsTools.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.toolingPathJsTools.resourceKey=tools/**
sonar.issue.ignore.multicriteria.toolingPathTsScripts.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.toolingPathTsScripts.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.toolingPathTsTools.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.toolingPathTsTools.resourceKey=tools/**
sonar.issue.ignore.multicriteria.tableHeader.ruleKey=typescript:S5256
sonar.issue.ignore.multicriteria.tableHeader.resourceKey=packages/ui/src/components/table.tsx
# Tailwind CSS v4 at-rules (@custom-variant, @source, @utility) are valid syntax
# but unrecognised by SonarQube's CSS parser — suppress css:S4662 for these files.
sonar.issue.ignore.multicriteria.cssAtRuleWeb.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.cssAtRuleWeb.resourceKey=apps/web/src/app/globals.css
sonar.issue.ignore.multicriteria.cssAtRuleTracker.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.cssAtRuleTracker.resourceKey=apps/project-tracker/app/globals.css
# recharts 3.x `Cell` import — flagged as deprecated by Sonar's stale rule data,
# but is an active, documented export in recharts 3.6+. Ticket: upstream rule update.
sonar.issue.ignore.multicriteria.rechartsCellSentiment.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.rechartsCellSentiment.resourceKey=apps/web/src/components/feedback-analytics/SentimentDistributionChart.tsx
sonar.issue.ignore.multicriteria.rechartsCellNps.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.rechartsCellNps.resourceKey=apps/web/src/components/feedback-analytics/NpsBreakdownBar.tsx
sonar.issue.ignore.multicriteria.rechartsCellDeals.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.rechartsCellDeals.resourceKey=apps/web/src/components/deals/DealsCharts.tsx
# document.execCommand — deprecated but required for contentEditable rich-text
# formatting. Selection-API migration tracked as separate tech-debt task.
sonar.issue.ignore.multicriteria.execCommand.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.execCommand.resourceKey=apps/web/src/components/email/EmailCompose.tsx
# tRPC v10 observable subscription — deprecated in v11 (async iterator migration
# tracked separately). Keeping current implementation until migration sprint.
sonar.issue.ignore.multicriteria.trpcSubscription.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.trpcSubscription.resourceKey=apps/api/src/modules/notifications/notifications.router.ts

# Host URL (uncomment and set when using remote SonarQube server)
# sonar.host.url=http://localhost:9000

# Authentication
# - Recommended: set `SONAR_TOKEN` in your environment or `.env.local` (do not commit tokens).
# - Avoid setting `sonar.login`/`sonar.token` here with placeholders; the scanner does not expand `${env.*}`.
