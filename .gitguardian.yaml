# GitGuardian configuration
# https://docs.gitguardian.com/internal-repositories-monitoring/integrations/git_hooks/pre_commit

version: 2

# Paths to exclude from GitGuardian scanning
paths-ignore:
  # Test files and directories
  - '**/*.test.ts'
  - '**/*.test.tsx'
  - '**/*.test.js'
  - '**/*.test.jsx'
  - '**/*.spec.ts'
  - '**/*.spec.tsx'
  - '**/*.spec.js'
  - '**/*.spec.jsx'
  - '**/tests/**'
  - '**/test/**'
  - '**/__tests__/**'
  - '**/fixtures/**'
  - '**/mocks/**'

  # Storybook files (contain example/demo data)
  - '**/*.stories.ts'
  - '**/*.stories.tsx'
  - '**/*.stories.js'
  - '**/*.stories.jsx'

  # Test integration/e2e directories
  - 'tests/**'
  - 'e2e/**'

  # Example and documentation files
  - '**/*.example.*'
  - '**/examples/**'
  - '**/docs/**'

  # Build outputs and dependencies
  - 'node_modules/**'
  - 'dist/**'
  - 'build/**'
  - '.next/**'
  - 'out/**'
  - 'coverage/**'

# Ignore specific false-positive patterns in the scanned files.
# Note: test/story/fixture/mock paths are already fully excluded above via paths-ignore.
secret:
  ignored_matches:
    # Test JWT tokens (not real secrets)
    - name: 'Test JWT tokens'
      match: "eyJ[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+"
    # Literal placeholder passwords used in test fixtures
    - name: 'Test passwords'
      match: '(password|Password|PASSWORD)'
    # Ephemeral local-dev/test Postgres credentials on localhost — throwaway
    # `postgres`/`test` values (postgres image defaults), never real secrets.
    # NARROWED: GitHub Actions workflows no longer rely on this ignore — every
    # workflow now sources its Postgres password from a repo secret
    # (CI_POSTGRES_PASSWORD / NIGHTLY_E2E_PG_PASSWORD / PERF_GATE_PG_PASSWORD),
    # enforced by workflow-secret-lint (0 literals across all workflow files).
    # This ignore now covers only local dev/test config that legitimately embeds
    # the localhost default: docker-compose.yml, .env.test, .env.*.example,
    # infra/supabase/*, and doc examples. Scoped to localhost/127.0.0.1 so a real
    # credential pointed at a reachable host is still flagged.
    - name: 'Ephemeral local Postgres credential (localhost dev/test config)'
      match: '(postgres|test):(postgres|test)@(localhost|127\.0\.0\.1)'
    - name: 'Ephemeral POSTGRES_PASSWORD service-container literal (docker-compose/local)'
      match: 'POSTGRES_PASSWORD:\s*(postgres|test)\b'
