    reason: >-
      Accepted design decision — upsert with empty update: {} is the canonical
      idempotency pattern in this codebase (IFC-309 plan §Step 7, NF-005). The
      terms_acceptances table has NO immutable-update trigger or no-UPDATE
      privilege policy; PostgreSQL with `update: {}` emits `UPDATE SET ` with
      zero columns assigned, which is a no-op (no data changes, no trigger fires).
      The IFC-309 plan and spec both explicitly choose the upsert pattern and
      the plan-reviewer signed off (APPROVE). The alternative — create + P2002
      catch + findFirst — is more complex, has a TOCTOU gap in high-concurrency,
      and is NOT a requirement in the spec. The empty update is defence-in-depth:
      even if the upsert mistakenly routes to the update branch, it modifies
      ZERO columns on the existing record. Source-anchored; re-blocks if the
      upsert or update block changes.
    author: talyssonoliver
    date: '2026-06-29'
    expires: '2026-12-31'
