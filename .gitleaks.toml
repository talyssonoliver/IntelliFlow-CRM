[[allowlists]]
description = "Generated attestation evidence: file-hash map entry whose repo path contains the word sentry (path is a file name, value is a hex digest)."
targetRules = ["sentry-access-token"]
paths = ['''^\.specify/sprints/sprint-1/attestations/IFC-074/attestation-latest\.json$''']

[[allowlists]]
description = "Vendored SonarQube rule corpus (rule metadata and UUID rule keys), generated third-party data, not credentials."
targetRules = ["generic-api-key"]
paths = ['''^sonar-small-rules\.json$''']

[[allowlists]]
description = "GitHub code-scanning API export: UUID alert keys and analysis fingerprints (hex digests), not credentials."
targetRules = ["generic-api-key"]
paths = ['''^artifacts/reports/code-scanning-alerts-all\.json$''']
