# Secret scan config. Rules: .gitleaks/shared.toml (shared by every repo; edit
# the canonical copy in C:/Users/talys/ops/secret-scan, never one repo alone).
# This file holds only this repo's allowlist: one file per entry, each with a
# reason. No folder-wide or test-wide exemptions: tests assemble
# credential-shaped strings at runtime and use *.example.invalid hosts.
[extend]
path = ".gitleaks/shared.toml"

[[allowlists]]
description = "Generated attestation evidence: each flagged line is a \"<repo path>\": \"<hex digest>\" file-hash map entry, not a credential. Files enumerated, one per path."
targetRules = ["generic-api-key"]
paths = [
