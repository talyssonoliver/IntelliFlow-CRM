# pnpm workspace configuration for IntelliFlow CRM monorepo
# This file defines the workspace structure for the monorepo

packages:
  # Applications
  - 'apps/*'
  - 'apps/workers/*'

  # Shared packages
  - 'packages/*'

  # Infrastructure tooling
  - 'tools/*'

  # NOTE: docs/ (Docusaurus) is deliberately NOT a workspace member.
  # Adding it was tried and reverted: `docs` has a `build` script, so
  # `turbo run build` (root `build`, which CI's required Build job runs) picks
  # it up. The content-preset path was fixed in #647 (it now points at docs/
  # instead of the nonexistent docs/docs/), but `docusaurus build` still fails
  # because the Markdown under docs/ has not been curated for MDX (malformed
  # front matter, JSX-hostile syntax). Folding docs in would therefore still
  # break the required Build gate. docs/ keeps its own lockfile and carries its
  # own `pnpm.overrides` mirroring the root set. Revisit only once the docs
  # site builds clean — tracked as the content-curation follow-up to #647.
