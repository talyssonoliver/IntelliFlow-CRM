  DEP-CVE-BRACES-STACKOVERFLOW-001:
    origin_task: '#452'
    owner: DevOps Lead
    severity: high
    description: >-
      Trivy alerts #3063 (app/node_modules/.pnpm/braces@3.0.3, intelliflow-crm-api
      image) and #3059 (docs/pnpm-lock.yaml) flag braces 3.0.3, CVE-2026-93687
      (stack-exhaustion DoS from deeply nested brace patterns). 3.0.3 is braces'
      latest published release (npm view braces version => 3.0.3, verified
      2026-10-13) and GHSA/NVD list first_patched_version: null — there is no
      patched version to bump to. Pulled transitively by micromatch@4.0.8 (a
      devDependency-of-devDependencies chain), which ships into the api image
      because `pnpm prune --prod` is deliberately not run in Dockerfile.api (see
      its own comment: pnpm v10 isolated-linker prune removes legitimate per-app
      prod symlinks too, #742).
    created_at: 2026-10-13
    status: open
    expiry_date: 2027-01-13
    remediation_sprint: 20
    remediation_plan: >-
      No upstream fix exists today — re-check `npm view braces versions` and the
      GHSA (GHSA for CVE-2026-93687) periodically; bump the moment a patched
      release ships. The real structural fix is making the api runner image prod-
      only again (resolve the pnpm v10 isolated-linker prune bug from the
      Dockerfile.api NOTE, e.g. via `pnpm deploy --filter api --prod`), which
      would drop this and the other app/node_modules residuals below in one
      move; tracked separately, out of scope for a CVE-only fix.
    notes: >-
      git issues #452/#377. Track B residual — no fixed version published
      upstream, confirmed via the GitHub Advisory Database vulnerable_version_range
      "<= 3.0.3" / first_patched_version null. Not exploitable via untrusted
      input in this codebase's actual usage. Tracked per project Rule 8.
