      (task-automation-engine.ts), so changing a schedule's time zone after a run is
      queued moves that run's task due date and its schedule variables (e.g. a
      dueInDays 0 run admitted at 22:30Z becomes due the next day after a switch to
      Pacific/Auckland). Found by the full-branch codex review.
    created_at: 2026-10-29
    expiry_date: 2027-01-29
    remediation_sprint: 19
    remediation_plan: >-
      Store the schedule time zone in the run's context at admission (as the
      actions are) and render due dates and schedule variables from that snapshot.
    status: resolved
    resolved_at: 2026-10-30
    resolution: >-
      Fixed in the PG-208 PR (orchestrator ruling 2026-10-29, raised again by a
      standalone codex pass after the merge with main). Admission stores
      scheduleTimezone in the run context with the slot; due dates and schedule.date
      read it, falling back to the rule's timezone for runs admitted earlier. Test:
      a timezone edit after admission keeps the run's date and due date.
    notes: 'Orchestrator ruling 2026-10-29 kept it as a follow-up; ruling 2026-10-29 (option a) fixed it in the PG-208 PR.'
  PG-208-POSTCONDITION-NOT-COMMIT-EVIDENCE-001:
    origin_task: PG-208
    owner: Backend Lead
    severity: medium
    description: >-
      Entity events are published inside the writing transaction, so the automation drain
      (task-automation-engine.ts) uses the record's current state (postconditionHolds) as
      evidence that the write committed. A lead that is qualified and then moved to LOST,
      UNQUALIFIED or CONTACTED before the next tick fails the postcondition, is retried for
      the 30 s grace and then dropped, so its lead.qualified rules never run. Accepted limit
      of ADR-084 (postcondition grace and the at-most-once intake window). Found by the
      pre-ship codex gate.
    created_at: 2026-10-29
    expiry_date: 2027-01-29
    remediation_sprint: 19
    remediation_plan: >-
      Deliver entity events after commit through the transactional outbox (#966) when
      automation moves to the combined worker, and process a committed event even when a
      later status change has happened; drop the postcondition check for those events.
    status: open
    notes: 'Orchestrator ruling 2026-10-29: waived (codex fingerprint 207bcd9f, expires with this entry), fixed with the outbox move (#966, PG-208-AUTOMATION-OFF-IN-PROD-001).'
  PG-208-WEBHOOK-UNKNOWN-TOKEN-IP-BUCKET-001:
    origin_task: PG-208
    owner: Backend Lead
    severity: low
    description: >-
      The webhook failure limiter (task-automation-webhook.ts) counts failures on a
      token that names a rule against that token from the caller's IP, but a
      well-formed token that matches no rule (for example the old URL after "New
      URL") still counts against the bare IP. A sender stuck on a regenerated URL
      behind a shared egress IP (Zapier, Make, n8n) can therefore still get that IP
      throttled for other tenants. Kept on purpose: keying unknown tokens per token
      would let random tokens dodge the bare-IP guard, and tokens are 256-bit. Found
      by the pre-ship full-scope review.
    created_at: 2026-10-29
    expiry_date: 2027-01-29
    remediation_sprint: 19
    remediation_plan: >-
      Remember the hashes of recently replaced webhook tokens for a grace period and
      count failures on them per token, or give unknown well-formed tokens a separate,
      higher bare-IP ceiling; test with a regenerated URL called from a shared IP.
    status: open
    notes: 'Orchestrator ruling 2026-10-29: accepted residual of the cross-tenant limiter fix in the PG-208 PR.'
  PG-208-ASSIGNEE-REMINDERS-001:
    origin_task: PG-208
    owner: Backend Lead
    severity: medium
    description: >-
      Owner ruling 6 lets a non-admin see tasks they own or are assigned to. task.list,
      task.getById and task.getByEntity apply it, but task.getReminders still reads
      overdue and due-soon tasks by owner only (getOverdueTasks(ownerId),
      getTasksDueSoon(ownerId)), so a round-robin assignee gets no reminder for a task
      automation assigned to them. Nobody is affected while automation is off in
      production (PG-208-AUTOMATION-OFF-IN-PROD-001). Found by the pre-ship full-scope
      review.
    created_at: 2026-10-29
    expiry_date: 2027-01-29
    remediation_sprint: 19
    remediation_plan: >-
      Include assigneeId = userId in the overdue and due-soon repository queries (or
      add assignee variants) before automation is switched on in production; add a
      router test for an assignee who does not own the task.
    status: open
    notes: 'Orchestrator ruling 2026-10-29: follow-up, not fixed in the PG-208 PR.'
  PG-208-WEBHOOK-PENDING-WHILE-OFF-001:
    origin_task: PG-208
    owner: Backend Lead
    severity: low
    description: >-
      While task automation is off (TASK_AUTOMATION_INTERVAL_MS=0, the production
      setting), the inbound webhook route still accepts signed calls and records a
      PENDING run with its webhook context. No runner drains those runs and the
      run purge does not remove PENDING rows, so they and their payload context
      stay in the database indefinitely. Found by the PG-208 Security STOA re-run
      (2026-10-29).
    created_at: 2026-10-29
    expiry_date: 2027-01-29
    remediation_sprint: 19
    remediation_plan: >-
      Either refuse webhook calls with 503 while the runner is off, or let the run
      purge remove PENDING runs older than the retention window; add a test for
      the interval=0 case. Revisit when the outbox move (#966) lands.
    status: open
    notes: 'Orchestrator ruling 2026-10-29: low debt entry, follow-up, not fixed in the PG-208 PR.'
