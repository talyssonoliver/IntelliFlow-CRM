maintainer: Tech Lead
items:
  LEGAL-MERGED-LCOV-DEADZONE-001:
    origin_task: '#445'
    owner: DevOps Lead
    severity: medium
    description: >
      apps/api/src/modules/legal/** is a merged-lcov dead-zone. The api coverage
      project (run-coverage.js `--project=api`) runs Istanbul over 4 parallel
      forks (apps/api/vitest.config.ts maxWorkers:4, pool:forks) and breaches
      thresholds, emitting a PARTIAL coverage-final.json (~135 of ~600 api files;
      the entire legal subtree dropped) while exiting "PASS" because all tests
      pass (run-coverage classifies non-zero+0-failures as threshold debt, not
      failure). So legal files never appear in the merged lcov and any changed
      legal line scores 0% in BOTH local check-diff-coverage AND Sonar
      new_coverage. Pre-existing on origin/main; documented under the IFC-242
      "flaky, passes in isolation/sharded CI" instrumentation flake. documents.router.ts
      IS covered in isolation (200 legal-documents tests incl. the #445 sign-IP
      tests). #445 added it to sonar.coverage.exclusions AND check-diff-coverage
      SONAR_COVERAGE_EXCLUDE (same pattern as supabase.ts #427 / shared/** IFC-242
      / ui #482) to unblock the security fix.
    created_at: 2026-06-16
    expiry_date: 2026-09-16
    remediation_sprint: 19
    remediation_plan: >
      Fix the api coverage instrumentation so the 4-fork Istanbul run captures the
      full api tree (e.g. lower forks under COVERAGE_RUN, or shard the api project
      locally as CI does), so legal appears in the merged lcov; then DROP the
      documents.router.ts exclusion from both gates and restore coverage gating on
      the legal routers. Until then legal coverage is enforced only by the api
      module tests in isolation + sharded CI.
    status: open
    notes: 'git issue to be filed. Tracked per project Rule 8. Do NOT broaden the exclusion beyond documents.router.ts without re-evaluating each legal router individually.'
  PRESHIP-385-lcov-absent-blind-spot:
    origin_task: IFC-256
    owner: DevOps Lead
    severity: high
    description: >
      check-diff-coverage.mjs skipped source files absent from lcov (no tests), so
      brand-new untested files passed the local diff-coverage gate at 100% while
      SonarCloud reported them as 0% new_coverage. Fixed in PR #382 (absent files
      now counted as 0%). Issue #385. Relates to pre-ship gate parity gap (#349).
    created_at: 2026-06-11T10:00:00.000Z
    expiry_date: 2026-09-11
    remediation_plan: >
      Fixed — absent-from-lcov files now treated as 0% covered. Remaining:
      (a) inbound.router.ts /<[^>]*>/ HTML-strip and autoresponse email regex
      should migrate to proper utilities (issue #383, tracked below).
    remediation_sprint: 6
    status: resolved
  PRESHIP-383-redos-bounded-disable:
    origin_task: PG-060
    owner: DevOps Lead
    severity: medium
    description: >
      Two production regexes and one test regex have sonarjs/slow-regex (S5852)
      eslint-disable suppressions with justification: /<[^>]*>/g (inbound.router.ts,
      bounded by > stop char) and /^[^\s@]+@[^\s@]+\.[^\s@]+$/ (test fixture).
      The trailing-slash /\/+$/ and leading/trailing underscore /^_+|_+$/ cases
      were fixed with safe alternatives. Suppressed cases tracked for migration
      to proper utilities (html-strip, validator email schema).
    created_at: 2026-06-11T10:00:00.000Z
    expiry_date: 2026-09-11
    remediation_plan: Migrate to html-strip utility + packages/validators email schema.
    remediation_sprint: 7
    status: open
  GATE-CODEX-001:
    origin_task: chore/codex-semantic-review-gate
    owner: Tech Lead
    severity: high
    description: >
      Revenue-band string "1M-10M" was mapped to 100 cents in a validator.
      Author tests asserted 100 (encoding the same wrong assumption), so
      TypeScript + ESLint + Sonar + coverage gates all passed. The bug class
      (author tests encode author wrong assumption) was not caught by any
      prior gate. Remediation: Codex Semantic Review gate (scripts/codex-review.mjs)
      added 2026-06-11. Local-only enforcement via pre-push; uses OAuth, no API key.
    created_at: 2026-06-11T00:00:00.000Z
    expiry_date: null
    remediation_plan: >
      Gate is live. Any future occurrence of this bug class is caught at
      pre-push via the local OAuth-authenticated codex CLI. No API key required.
      Confirm auth with: codex login status.
    remediation_sprint: chore
    status: remediated
