# Shared secret-scan rules. Canonical copy: C:/Users/talys/ops/secret-scan/shared.toml
# Every repo carries an identical copy at .gitleaks/shared.toml; edit the
# canonical copy and re-sync, never one repo alone.
#
# Owner ruling 2026-10-04: a credential-SHAPED string is a finding even when
# the value is fake. GitGuardian flags shape, and so would anyone else
# scanning the repo. Tests build such strings at runtime from parts
# ('post' + 'gres://') and use *.example.invalid hosts.
#
# The rules below add what gitleaks' defaults miss and GitGuardian catches:
# its defaults have entropy floors and stopwords that let low-entropy fakes
# (a database URI with a short password, a short Bearer token) through.

[extend]
useDefault = true

[[rules]]
id = "uri-credentials"
description = "Credentials embedded in a connection URI (postgres, redis, mongodb, amqp, https...)"
regex = '''(?i)\b[a-z][a-z0-9+.-]{1,20}://[^\s:/@'"`<>{}$]{1,64}:([^\s/@'"`<>{}$]{1,128})@[a-z0-9_.\[\]-]+'''
secretGroup = 1
keywords = ["://"]

[[rules]]
id = "bearer-token"
description = "Literal Bearer token"
regex = '''(?i)\bbearer\s+([a-z0-9\-._~+/]{12,}=*)'''
secretGroup = 1
keywords = ["bearer"]

[[rules]]
id = "password-literal"
description = "Quoted literal assigned to a password field"
regex = '''(?i)\b[a-z0-9_]*(?:password|passwd|pwd)["']?\s*(?::|=|=>)\s*["'`]([^"'`\s$<>{}]{6,})["'`]'''
secretGroup = 1
keywords = ["password", "passwd", "pwd"]

# GitGuardian's Generic Password also fires on a password-named variable built
# from literal pieces (an array join or a string concatenation). Seen
# 2026-10-05 on taly_planner 254e2ec. Use filler ('x'.repeat(12)) instead.
[[rules]]
id = "password-fragments"
description = "Password-named field assembled from literal fragments"
regex = '''(?i)\b[a-z0-9_]*(?:password|passwd|pwd)["']?\s*(?::|=|=>)\s*(?:\[\s*)?["'`]([^"'`\s$<>{}]{2,})["'`]\s*[+,]'''
secretGroup = 1
keywords = ["password", "passwd", "pwd"]

# Unquoted YAML: docker compose and workflow env blocks write
# `POSTGRES_PASSWORD: value` with no quotes, which password-literal misses
# and GitGuardian flags (Generic Password, 2026-07-24). Values starting with
# $, {, <, * or & (env refs, templates, anchors) are not literals.
[[rules]]
id = "password-yaml"
description = "Unquoted literal assigned to a password key in YAML"
regex = '''(?im)^[ \t-]*[a-z0-9_]*(?:password|passwd|pwd)[a-z0-9_]*[ \t]*:[ \t]+([^\s"'`$<{#*&|>][^\s#]{3,})[ \t]*(?:#.*)?$'''
secretGroup = 1
path = '''\.(?:ya?ml)$'''
keywords = ["password", "passwd", "pwd"]

[[rules]]
id = "notion-token"
description = "Notion integration token"
regex = '''\b((?:ntn|secret)_[A-Za-z0-9]{30,})'''
secretGroup = 1
keywords = ["ntn_", "secret_"]

[[rules]]
id = "neon-host"
description = "Real-looking Neon database host"
regex = '''\b(ep-[a-z0-9-]+\.[a-z0-9.-]*neon\.tech)\b'''
secretGroup = 1
keywords = ["neon.tech"]

[[rules]]
id = "openai-style-key"
description = "sk- prefixed API key (OpenAI, Anthropic and similar)"
regex = '''\b(sk-(?:proj-|ant-|live-)?[A-Za-z0-9_-]{20,})'''
secretGroup = 1
keywords = ["sk-"]

[[rules]]
id = "stripe-webhook-secret"
description = "Stripe webhook signing secret"
regex = '''\b(whsec_[A-Za-z0-9]{16,})'''
secretGroup = 1
keywords = ["whsec_"]

[[rules]]
id = "jwt-any"
description = "JWT-shaped string (header.payload.signature), signed or not"
regex = '''\b(eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{0,})'''
secretGroup = 1
keywords = ["eyj"]

# GitGuardian "Generic High Entropy Secret" parity (incident 2026-10-22,
# IntelliFlow-CRM 21b855149: path -> sha256 map entries whose KEY contains
# "OAuth" or "Secret"). GitGuardian's detector (docs.gitguardian.com, generics/
# generic_high_entropy_secret) flags {variable} {assign-token} {value} when the
# variable name contains secret|token|api[_.-]?key|credential|auth and the value
# matches [a-zA-Z0-9_.+/~$-][a-zA-Z0-9_.+/=~$-]{14,1022}[...], has Shannon
# entropy >= 3 and >= 2 digits, and survives its value banlist. "auth" matches
# inside "OAuth"; the variable may be a quoted JSON key such as a file path.
# Assign tokens are : = := => , > ( <-. Rename the key or hash the whole map
# value; do not put a long hex/base64 value next to such a name.
[[rules]]
id = "sensitive-name-high-entropy"
description = "Long high-entropy value assigned to a name containing secret/token/api key/credential/auth/passw"
regex = '''(?i)[^\s=:,;(){}\[\]]*(?:secret|token|api[_.-]?key|credential|auth|passw(?:or)?d)[^\s=:,;(){}\[\]]*["'`]?[ \t]*(?:(?::=|=>|<-|[:=])[ \t]*["'`]?|[,>(][ \t]*["'`])([a-z0-9_.+/~$-][a-z0-9_.+/=~$-]{14,250}[a-z0-9_.+/=~$-])'''
secretGroup = 1
entropy = 3.0
keywords = ["secret", "token", "key", "credential", "auth", "passw"]

[[rules.allowlists]]
description = "Mirrors GitGuardian's own exclusions: fewer than two digits, and its value banlist (ids, hashes of tests, examples, versions, bcrypt, hex literals, paths)"
regexTarget = "secret"
regexes = [
  '''^[^0-9]*[0-9]?[^0-9]*$''',
  '''(?i)^(id|mid|mnp|auth|trnsl|oqs_kem|pos|new|aes|wpa|ec|sec|zte|tls|pub|pk|ds|-)[_.-]''',
  '''(?i)^(com\.|aizasy|0x[0-9a-f]+$|/tmp/|\$2[abxy]\$)''',
  '''(?i)(parentkey|auto|enrich|frontend|options|layout|group|field|gatsby|transform|random|12345|4321|abcd|test|country|template|preview|alpha|beta|fake|keyring|example|placeholder|redacted)''',
  '''(?i)(_size|[_.-]length)$''',
  '''(?i)(^|[^a-z0-9])v?\d\.\d{1,3}\.\d{1,3}([_.-]|$)''',
  '''(?i)^(\$\{|process\.env|import\.meta|env\.)''',
  # GitGuardian's heuristic filters: url, date, file name, number, path.
  '''(?i)^([a-z][a-z0-9+.-]*:)?//''',
  '''^\d{4}-\d{2}-\d{2}''',
  '''(?i)\.(tsx?|jsx?|mjs|cjs|json|md|mdx|txt|csv|ya?ml|png|jpe?g|svg|html?|css|log)(\?.*)?$''',
  '''(?i)^[./~]*[a-z0-9_@.-]+(/[a-z0-9_@.-]+)+/?$''',
  # A lowercase kebab/snake phrase of three or more words is prose, not entropy
  # (GitGuardian's DictFilter): your-super-secret-jwt-token-with-at-least-32-chars.
  '''^[a-z]+([-_.][a-z0-9]+){2,}$''',
]

# GitGuardian's context-window banlist: when one of these words sits within 30
# characters of the value it drops the finding. Gitleaks cannot window, so match
# the variable name plus value instead: a JSON key such as
# "components/__tests__/SecretField.test.tsx" carries "test" right beside the
# value (observed: tests and hashes were NOT flagged in the 2026-10-22 incident).
[[rules.allowlists]]
description = "GitGuardian context-window banlist, matched against variable + value"
regexTarget = "match"
regexes = [
  '''(?i)(test|hash|sha|csrf|xsrf|theme|playlist|localhost|127\.0\.0\.1|licensekey|document_?key|pubkey|public[_.-]?key|publishable_?key|key[_.-]?(?:id|user)|token[_.-]?(?:id|address)|credentials?[_.-]?id|client[_.-]?id|secret[_.-]?id|secret_key_base|authenticity_token|propert(?:y|ies)|foreign|author|\.jpe?g|\.png)''',
  # GitGuardian's AssignmentBanlistPostValidator: variable names it never flags.
  # Next.js RSC cache-busting query on a page route (/forgot-password?_rsc=...).
  '''(?i)[?&]_rsc=''',
  '''(?i)(id_token|(?:credentials|session|secrets)id|encrypted|postman[_-]token|tokenizer|next[_-]?page[_-]?token|previous[_-]?page[_-]?token|ahoy_visit|uuid|algolia_search)''',
]

# GitGuardian "SMTP credentials": host, port, username and password assigned
# to variables. It fired on `smtpHost / smtpPort / smtpUsername / password`
# field NAMES in a TypeScript interface (IntelliFlow-CRM 3eb3a2a23, no values).
# Flag an smtp host name and an smtp user name with a password-ish name within
# ~400 characters, in either order. Use non-smtp names (`host`, `login`,
# `secret`) or keep the three in separate modules.
[[rules]]
id = "smtp-credential-fields"
description = "smtp host + smtp username + password identifiers co-occurring (GitGuardian SMTP credentials)"
regex = '''(?is)\b(smtp[_.-]?(?:host|server)[a-z0-9_]*.{1,400}?smtp[_.-]?(?:user(?:name)?|login)[a-z0-9_]*.{1,400}?pass(?:word|wd)?|smtp[_.-]?(?:user(?:name)?|login)[a-z0-9_]*.{1,400}?smtp[_.-]?(?:host|server)[a-z0-9_]*.{1,400}?pass(?:word|wd)?|smtp[_.-]?(?:user(?:name)?|login)[a-z0-9_]*.{1,400}?pass(?:word|wd)?[a-z0-9_]*.{1,400}?smtp[_.-]?(?:host|server))'''
secretGroup = 1
keywords = ["smtp"]
path = '''\.(?:[cm]?[jt]sx?|json|ya?ml|env[a-z.]*|py|go|rb|php|toml|ini|properties|cfg|conf|sh)$|(^|/)\.env[a-z.]*$'''

[[rules.allowlists]]
description = "The kit's own rule file spells out the identifiers it looks for"
paths = ['''(^|/)\.gitleaks/shared\.toml$''']

# Placeholders that are not credential-shaped. Narrow on purpose: the value
# must be ONLY a placeholder, not merely contain one.
[[allowlists]]
description = "Pure placeholders: repeated filler characters, env/template references, angle-bracket names"
regexTarget = "secret"
regexes = [
  '''^(?i)(x+|\*+|\.+|_+|#+|0+|-+)$''',
  '''^(?i)ep-x+\.[a-z0-9.-]*neon\.tech$''',
  '''^(?i)(redacted|\[redacted\])$''',
]
