name: 'IntelliFlow CodeQL config'

queries:
  - uses: security-extended
  - uses: security-and-quality

paths-ignore:
  # Project-relative paths.
  - artifacts/**
  - '**/dist/**'
  - '**/.next/**'
  - '**/.turbo/**'
  - '**/node_modules/**'
  - '**/coverage/**'
  - '**/playwright-report/**'
  - '**/.specify/sprints/**/execution/**'
  # Tool-generated report HTML embeds vendored viewer bundles
  # (Lighthouse/Playwright/k6) — the IFC-033 vector. CodeQL default-setup
  # ignores THIS config and flags such bundles as noise; the advanced setup
  # honours these ignores. `artifacts/**` (above) and `docs/evidence/**`
  # (below) cover the committed reports; `.lighthouseci/**` lives at the repo
  # root, so it needs its own entry. The pre-ship `vendored-js-lint` gate is
  # the enforcement backstop that catches the pattern at commit time,
  # regardless of which CodeQL setup GitHub runs.
  # See docs/security/codeql-configuration.md.
  - '**/.lighthouseci/**'
  # Vendored / minified JavaScript is third-party, not our source. Analysing it
  # produces alerts on code we neither wrote nor ship as our own.
  - '**/*.min.js'
  - '**/*.min.css'
  - '**/*.bundle.js'
  # Container/scanner-internal paths. The Trivy + Docker-scan jobs run
  # CodeQL against built images, so alerts can surface with prefixes like
  # `/app/...`, `/usr/...`, or `file:///github/workspace/...`. Those are
  # never source code under our control — exclude them so CodeQL alerts
  # stay focused on the actual repo tree.
  #
  # NOTE: CodeQL's glob rejects `**` that doesn't follow a path segment.
  # `'file:**'` is INVALID and was rejected by CodeQL with "pathsIgnore
  # 'file:**' contains an invalid '**' wildcard". The `file:///...`
  # URL-prefixed alerts are handled via UI batch-dismissal (performed
  # 2026-05-26) instead.
  - '/app/**'
  - 'app/**'
  - '/usr/**'
  - 'usr/**'
  # Test fixtures that intentionally contain JWT-shaped strings (k6
  # benchmark outputs, OAuth flow fixtures, etc). These are non-functional
  # data files committed for reproducibility; the secret-scanning workflow
  # (secret-scan.yml + .gitleaks.toml allowlist) is the authoritative
  # check for real secrets.
  - 'artifacts/benchmarks/**'
  - 'tests/**/fixtures/**'
  # Committed evidence bundles (load-test reports, screenshots, JSON summaries).
  # These are generated run artifacts committed for reproducibility, not source.
  - 'docs/evidence/**'
