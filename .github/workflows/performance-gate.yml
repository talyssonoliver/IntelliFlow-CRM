# IFC-007: Performance Gate Workflow
# Validates performance benchmarks using k6 load testing
# Blocks merge on threshold violations

name: Performance Gate

# Pre-MVP: PR trigger disabled. The gate spins up Postgres + Redis, runs
# Prisma migrations + seed, then k6-loads the API — only meaningful once
# we have a stable seed dataset and tuned thresholds. Until then it's noise
# on every PR. Triggered manually via `gh workflow run performance-gate.yml`.
# To re-enable PR mode, restore the `pull_request:` block below.
#
# Issue #318 (owner decision 2026-10-12): the 1,000-VU `k6-nightly-1000vu` job
# below runs on the `schedule:` cron, on a SELF-HOSTED runner — not
# GitHub-hosted minutes, and not per-PR. It validates the IFC-007 "1,000
# concurrent users" headline, which until now was stub evidence only
# (issue #312). The other two jobs in this file stay workflow_dispatch-only
# and GitHub-hosted, unaffected by this schedule.
on:
  workflow_dispatch:
    inputs:
      run_full_test:
        description: 'Run full 1000 VU test (takes ~10 min)'
        required: false
        default: 'false'
        type: boolean
      run_nightly_now:
        description: 'Manually trigger the self-hosted nightly 1000-VU job (#318) instead of waiting for its cron'
        required: false
        default: 'false'
        type: boolean
  schedule:
    # Nightly, once a day — never sub-daily (2026-10-05 Actions-minutes
    # ruling). Runs on a self-hosted runner anyway, so it doesn't draw from
    # the GitHub-hosted free-minutes budget at all; the once-daily cadence
    # matches issue #318's "nightly" ask and keeps the self-hosted machine
    # from fighting itself (pre-ship, other lanes) more than once a night.
    - cron: '0 4 * * *'
  # pull_request:
  #   branches: [main, develop]
  #   paths:
  #     - 'apps/api/**'
  #     - 'packages/**'
  #     - 'artifacts/misc/k6/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  DATABASE_URL: postgresql://postgres:${{ secrets.PERF_GATE_PG_PASSWORD }}@localhost:5432/intelliflow_test

jobs:
  performance-test:
    name: k6 Performance Test
    # Manual-dispatch only — the new `schedule:` trigger (#318) is for
    # `k6-nightly-1000vu` alone. Without this guard this job would otherwise
    # also fire every night on GitHub-hosted minutes, since `inputs.*` is
    # empty (not `!= 'true'` false) on a schedule event.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pull-requests: write
      contents: read

    services:
      postgres:
        # pgvector image so the baseline migration's `CREATE EXTENSION vector`
        # works. Vanilla postgres:15 doesn't ship the pgvector binaries.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.PERF_GATE_PG_PASSWORD }}
          POSTGRES_DB: intelliflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Verify k6 installation
        run: k6 version

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Bootstrap Supabase schemas + roles
        run: |
          PGPASSWORD=${{ secrets.PERF_GATE_PG_PASSWORD }} psql -h localhost -U postgres -d intelliflow_test -v ON_ERROR_STOP=1 <<'SQL'
            -- Schemas: baseline migration uses `CREATE EXTENSION ... WITH SCHEMA "extensions"`
            -- which Supabase auto-creates but vanilla postgres does not.
            CREATE SCHEMA IF NOT EXISTS extensions;
            -- Roles: Supabase's standard triplet, referenced by GRANT statements
            -- in the baseline migration. CREATE ROLE IF NOT EXISTS isn't valid
            -- Postgres syntax — guard with pg_roles lookup.
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
                CREATE ROLE anon NOLOGIN;
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
                CREATE ROLE authenticated NOLOGIN;
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
                CREATE ROLE service_role NOLOGIN BYPASSRLS;
              END IF;
            END
            $$;
            GRANT USAGE ON SCHEMA extensions TO postgres, anon, authenticated, service_role;
          SQL

      - name: Run database migrations
        run: pnpm run db:migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Seed test data
        run: pnpm run db:seed
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Build API server
        run: pnpm --filter api build

      - name: Start API server
        run: |
          pnpm --filter api start &
          sleep 15
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/trpc/health.ping >/dev/null 2>&1; then
              echo "API server is ready"
              break
            fi
            echo "Waiting for API server... ($i/30)"
            sleep 2
          done
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}

      - name: Run auth smoke test
        id: smoke-test
        run: |
          k6 run --summary-export=artifacts/benchmarks/ci-smoke.json \
            --env SUPABASE_URL=${{ env.SUPABASE_URL }} \
            --env SUPABASE_ANON_KEY=${{ env.SUPABASE_ANON_KEY }} \
            --env BASE_URL=http://localhost:3000 \
            tools/scripts/k6/__tests__/auth-smoke.js || true

      - name: Run performance test (smoke)
        id: perf-test
        if: inputs.run_full_test != 'true'
        run: |
          k6 run --summary-export=artifacts/benchmarks/ci-perf.json \
            --env SUPABASE_URL=${{ env.SUPABASE_URL }} \
            --env SUPABASE_ANON_KEY=${{ env.SUPABASE_ANON_KEY }} \
            --env BASE_URL=http://localhost:3000 \
            tools/scripts/k6/authenticated-load-test.js || true

      - name: Run performance test (full)
        id: perf-test-full
        if: inputs.run_full_test == 'true'
        run: |
          k6 run --summary-export=artifacts/benchmarks/ci-perf-full.json \
            --env SUPABASE_URL=${{ env.SUPABASE_URL }} \
            --env SUPABASE_ANON_KEY=${{ env.SUPABASE_ANON_KEY }} \
            --env BASE_URL=http://localhost:3000 \
            tools/scripts/k6/load-test.js || true

      - name: Validate performance thresholds
        id: validate
        # Only validate if a results file exists — the API server may fail to start
        # when SUPABASE_URL is unavailable in CI. Without results, skip validation
        # rather than failing the entire job.
        if: |
          hashFiles('artifacts/benchmarks/ci-perf.json') != '' ||
          hashFiles('artifacts/benchmarks/ci-perf-full.json') != ''
        run: |
          RESULTS_FILE="artifacts/benchmarks/ci-perf.json"
          if [ "${{ inputs.run_full_test }}" == "true" ]; then
            RESULTS_FILE="artifacts/benchmarks/ci-perf-full.json"
          fi

          if [ ! -f "$RESULTS_FILE" ]; then
            echo "Error: Results file not found: $RESULTS_FILE"
            exit 1
          fi

          # Parse metrics using Node.js
          node -e "
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('$RESULTS_FILE'));

            // Extract metrics with fallbacks
            const httpDuration = results.metrics?.http_req_duration?.values || {};
            const p95 = httpDuration['p(95)'] || 0;
            const p99 = httpDuration['p(99)'] || 0;
            const errorRate = (results.metrics?.errors?.values?.rate || 0) * 100;

            console.log('=== IFC-007 Performance Results ===');
            console.log('p95 Latency:', p95.toFixed(2), 'ms (threshold: 200ms)');
            console.log('p99 Latency:', p99.toFixed(2), 'ms (threshold: 500ms)');
            console.log('Error Rate:', errorRate.toFixed(2), '% (threshold: 10%)');
            console.log('===================================');

            // Set output for PR comment
            const summary = {
              p95: p95.toFixed(2),
              p99: p99.toFixed(2),
              errorRate: errorRate.toFixed(2),
              p95Pass: p95 <= 200,
              p99Pass: p99 <= 500,
              errorPass: errorRate <= 10,
            };
            fs.writeFileSync('perf-summary.json', JSON.stringify(summary));

            // Determine overall pass/fail
            let exitCode = 0;
            if (p95 > 200) {
              console.error('FAIL: p95 latency exceeds 200ms threshold');
              exitCode = 1;
            }
            if (p99 > 500) {
              console.error('FAIL: p99 latency exceeds 500ms threshold');
              exitCode = 1;
            }
            if (errorRate > 10) {
              console.error('FAIL: Error rate exceeds 10% threshold');
              exitCode = 1;
            }

            if (exitCode === 0) {
              console.log('PASS: All performance thresholds met');
            }

            process.exit(exitCode);
          "

      - name: Upload performance artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-results-${{ github.run_id }}
          path: |
            artifacts/benchmarks/ci-*.json
            perf-summary.json
          retention-days: 30

      - name: Comment PR with results
        uses: actions/github-script@v9
        if: github.event_name == 'pull_request' && always()
        with:
          script: |
            const fs = require('fs');

            let summary = { p95: 'N/A', p99: 'N/A', errorRate: 'N/A', p95Pass: false, p99Pass: false, errorPass: false };
            try {
              summary = JSON.parse(fs.readFileSync('perf-summary.json', 'utf8'));
            } catch (e) {
              console.log('Could not read perf-summary.json');
            }

            const status = summary.p95Pass && summary.p99Pass && summary.errorPass ? '✅ PASSED' : '❌ FAILED';

            const body = `## 📊 IFC-007 Performance Test Results

            **Status**: ${status}

            | Metric | Value | Threshold | Status |
            |--------|-------|-----------|--------|
            | p95 Latency | ${summary.p95}ms | ≤200ms | ${summary.p95Pass ? '✅' : '❌'} |
            | p99 Latency | ${summary.p99}ms | ≤500ms | ${summary.p99Pass ? '✅' : '❌'} |
            | Error Rate | ${summary.errorRate}% | ≤10% | ${summary.errorPass ? '✅' : '❌'} |

            <details>
            <summary>📈 Performance Targets (IFC-007)</summary>

            - **p99 < 100ms** under 1000 VU load (production target)
            - **p95 < 200ms** for CI gate (current threshold)
            - **Error rate < 1%** (production target)
            - **Error rate < 10%** for CI gate (current threshold)

            </details>

            ---
            🤖 *Generated by IFC-007 Performance Gate*
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  # IFC-033: Sprint-19 critical-path load test (ADR-018 budget). No Supabase
  # secrets required — authenticates via the dev-auth fallback
  # (ALLOW_DEV_AUTH_FALLBACK) against a locally-seeded DB. The ephemeral
  # postgres service password is sourced from the repo secret
  # PERF_GATE_PG_PASSWORD (throwaway value; kept out of the workflow source so
  # secret scanners don't flag the connection string). k6's own thresholds
  # (p95<200ms, error<0.1%) gate the job. `VALIDATE:pnpm test:load`.
  ifc-033-critical-path:
    name: IFC-033 k6 Critical-Path Load Test
    # Manual-dispatch only — see the comment on `performance-test` above.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:${{ secrets.PERF_GATE_PG_PASSWORD }}@localhost:5432/intelliflow_test
      DIRECT_URL: postgresql://postgres:${{ secrets.PERF_GATE_PG_PASSWORD }}@localhost:5432/intelliflow_test
      NODE_ENV: development
      ALLOW_DEV_AUTH_FALLBACK: 'true'
      PORT: '4000'
      # psql reads PGPASSWORD from the environment — no inline credential needed.
      PGPASSWORD: ${{ secrets.PERF_GATE_PG_PASSWORD }}
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.PERF_GATE_PG_PASSWORD }}
          POSTGRES_DB: intelliflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      - name: Generate Prisma client
        run: pnpm run db:generate
      - name: Bootstrap Supabase schemas + roles
        run: |
          psql -h localhost -U postgres -d intelliflow_test -v ON_ERROR_STOP=1 <<'SQL'
            CREATE SCHEMA IF NOT EXISTS extensions;
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN BYPASSRLS; END IF;
            END
            $$;
            GRANT USAGE ON SCHEMA extensions TO postgres, anon, authenticated, service_role;
          SQL
      - name: Run migrations + seed
        run: pnpm run db:migrate && pnpm run db:seed
      - name: Build API server
        run: pnpm --filter "@intelliflow/api..." build
      - name: Seed QUALIFIED-lead conversion pool
        run: |
          psql -h localhost -U postgres -d intelliflow_test -v ON_ERROR_STOP=1 -c "
            INSERT INTO leads (id, email, \"tenantId\", \"ownerId\", status, score, \"updatedAt\", company, \"firstName\", \"lastName\", source)
            SELECT gen_random_uuid()::text, 'k6pool-'||g||'-'||floor(random()*1000000000)::bigint||'@loadtest.example.com',
                   '00000000-0000-4000-8000-000000000001','00000000-0000-4000-8000-000000000103','QUALIFIED',80,now(),'PoolCo '||g,'Pool','Lead'||g,'WEBSITE'
            FROM generate_series(1,300) g;"
          mkdir -p tools/scripts/k6/.data
          psql -h localhost -U postgres -d intelliflow_test -tAc \
            "select json_agg(id) from (select id from leads where email like 'k6pool-%' and status='QUALIFIED') t;" \
            > tools/scripts/k6/.data/qualified-leads.json
      - name: Start API server (dev-auth on :4000)
        run: |
          pnpm --filter @intelliflow/api start &
          for i in $(seq 1 30); do
            if curl -s http://localhost:4000/health >/dev/null 2>&1; then echo "API ready"; break; fi
            echo "waiting for API... ($i/30)"; sleep 2
          done
      - name: Run IFC-033 load test (pnpm test:load)
        run: pnpm test:load
        env:
          BASE_URL: http://localhost:4000
          # Keep aggregate single-user rate under the AUTHENTICATED tier (~16.7 req/s).
          INGEST_RPS: '6'
          CONVERT_RPS: '1'
          DURATION: '2m'
      - name: Upload IFC-033 evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ifc-033-load-${{ github.run_id }}
          path: |
            artifacts/reports/load-test-report.html
            artifacts/benchmarks/ifc-033-load-summary.json
          retention-days: 30

  # Issue #318 — nightly 1,000-VU k6 load test. Owner decision 2026-10-12:
  # run on a SELF-HOSTED runner, not GitHub-hosted minutes, and on a
  # schedule, not per-PR. Validates the IFC-007 "1,000 concurrent users"
  # headline, which until now was stub evidence only (issue #312 — see
  # .specify/sprints/sprint-3/attestations/IFC-007/attestation.json
  # kpi_results[0]: "1000 VU in k6 load-test.js stages", never an actual
  # measured run).
  #
  # Target environment: the issue did not name a specific non-production
  # environment, so this follows the SAME ephemeral-Postgres pattern already
  # proven above in `ifc-033-critical-path` (ubuntu-latest's ephemeral
  # `pgvector/pgvector:pg15`), rather than a real Supabase project. The
  # `?pgbouncer=true` suffix on DATABASE_URL mirrors the production
  # connection-string SHAPE (issue #312 / PR #300's :6543?pgbouncer=true) —
  # it disables Prisma's prepared-statement cache the way Supavisor's
  # transaction-pooler mode requires — but plain Postgres has no actual
  # Supavisor behind it, so this does not exercise pooler-specific failure
  # modes (connection-ceiling exhaustion etc.). That needs a real non-prod
  # Supabase project with its own 6543 pooler; out of scope here.
  #
  # Local `supabase start` is NOT used for this job: it is a known, currently
  # broken path on this owner's machine (pgvector extension defect, recorded
  # 2026-06-26 — see docs/operations/sprint-18-pg-181-session-issues-log.md
  # and artifacts/lighthouse/PG-196/README.md), which is also where any
  # self-hosted runner for this repo would run.
  #
  # ⚠ No self-hosted runner is registered on this repo yet — verified
  # 2026-10-12 via `gh api repos/talyssonoliver/IntelliFlow-CRM/actions/runners`
  # (0 runners). This job will show "queued" forever, not "slow", until one
  # is registered with at least the `self-hosted` label (plus `Linux` and
  # Docker, for the `services:` block below) — e.g. following the same
  # pattern as COA's WSL runner (`talysson-wsl-cal`, self-hosted/Linux/X64).
  # Registering a new CI runner is infrastructure on the owner's machine, so
  # it is left for the owner rather than done here.
  k6-nightly-1000vu:
    name: 'IFC-007 Nightly k6 1000-VU Load Test (#318)'
    # The `schedule:` trigger fires the WHOLE workflow; only this job should
    # act on it. A human can also force an out-of-band run via
    # workflow_dispatch with run_nightly_now=true, independent of the other
    # two (GitHub-hosted, manual-only) jobs above.
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_nightly_now == 'true')
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    env:
      # Host port 55432 is deliberately NOT 5432 or 5433: this self-hosted
      # runner is the owner's own machine, which also runs the pre-ship
      # gate's `intelliflow-postgres-test` container on 5433
      # (scripts/lib/preship-integration-infra.mjs) and may have a plain dev
      # Postgres on 5432. Colliding with either fails this job for a reason
      # that looks like a real failure and isn't one (see the
      # ci-service-ports-collide-with-local-verification lesson from COA).
      DATABASE_URL: postgresql://postgres:${{ secrets.PERF_GATE_PG_PASSWORD }}@localhost:55432/intelliflow_test?pgbouncer=true
      DIRECT_URL: postgresql://postgres:${{ secrets.PERF_GATE_PG_PASSWORD }}@localhost:55432/intelliflow_test
      PGPASSWORD: ${{ secrets.PERF_GATE_PG_PASSWORD }}
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.PERF_GATE_PG_PASSWORD }}
          POSTGRES_DB: intelliflow_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install k6 (if missing on this self-hosted runner)
        run: |
          if ! command -v k6 >/dev/null 2>&1; then
            sudo gpg -k
            sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
            echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
            sudo apt-get update
            sudo apt-get install -y k6
          fi
          k6 version
      - name: Generate Prisma client
        run: pnpm run db:generate
      - name: Bootstrap Supabase schemas + roles
        run: |
          PGPASSWORD=${{ secrets.PERF_GATE_PG_PASSWORD }} psql -h localhost -p 55432 -U postgres -d intelliflow_test -v ON_ERROR_STOP=1 <<'SQL'
            CREATE SCHEMA IF NOT EXISTS extensions;
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN BYPASSRLS; END IF;
            END
            $$;
            GRANT USAGE ON SCHEMA extensions TO postgres, anon, authenticated, service_role;
          SQL
      - name: 'Run migrations + seed (seeded dataset per #318)'
        run: pnpm run db:migrate && pnpm run db:seed
      - name: Build API server
        run: pnpm --filter api build
      - name: Start API server
        run: |
          pnpm --filter api start &
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/api/trpc/health.ping >/dev/null 2>&1; then echo "API ready"; break; fi
            echo "waiting for API... ($i/30)"; sleep 2
          done
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Run nightly 1000-VU k6 load test (tools/scripts/k6/load-test.js)
        id: nightly-k6
        run: |
          mkdir -p artifacts/benchmarks
          k6 run --summary-export=artifacts/benchmarks/nightly-1000vu-${{ github.run_id }}.json \
            --env BASE_URL=http://localhost:3000 \
            tools/scripts/k6/load-test.js
      - name: Build IFC-007 SLO summary from the real run (never fabricated)
        if: always()
        run: node tools/scripts/k6/summarize-nightly-ifc007.mjs artifacts/benchmarks/nightly-1000vu-${{ github.run_id }}.json
      - name: Upload nightly k6 summary + SLO artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ifc-007-nightly-k6-${{ github.run_id }}
          path: |
            artifacts/benchmarks/nightly-1000vu-${{ github.run_id }}.json
            artifacts/benchmarks/ifc-007-nightly-slo.json
          retention-days: 90
