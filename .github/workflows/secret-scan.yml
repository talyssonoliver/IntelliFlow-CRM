# Secret scanning — must NEVER be skipped on any change.
#
# Split out from security.yml so that the cost-saving `paths-ignore` on
# the heavy scanners (Trivy, OWASP Dependency-Check, CodeQL, npm-audit)
# does not also disable secret detection on doc-only PRs. Secrets can
# absolutely live in Markdown, so this workflow carries NO path filters.
#
# Scanner: the shared gitleaks kit in .gitleaks/ (pinned gitleaks, rules in
# .gitleaks/shared.toml, per-file allowlist in .gitleaks.toml). Output is
# file:line and rule id only; matched values are never printed.
#   - push / pull_request: scans the commits being added (BASE..HEAD).
#   - nightly schedule / manual run: scans every tracked file at HEAD.

name: Secret Scanning

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: bash .gitleaks/install-ci.sh

      - name: Scan the pushed commits
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            sh .gitleaks/scan.sh tree
          else
            sh .gitleaks/scan.sh range "$BASE" "$HEAD_SHA"
          fi
