name: Synthetic Monitoring

# Applies infra/monitoring/grafana/cloud/synthetic-monitoring.json: the
# production /health/ready uptime probe and its alert rule (IFC-032
# follow-up, #811). The JSON is the source of truth; this job only pushes it.
# Runs on merge when the config or the script change, or by hand.
#
# NOT runnable yet. Two owner steps come first (see docs/observability/README.md
# and PR #811):
#   1. Initialize the Synthetic Monitoring app on the graysushi1880 stack
#      (Grafana Cloud -> Testing & synthetics -> Synthetics -> "Initialize").
#   2. Generate a Synthetic Monitoring access token (Synthetics -> Config ->
#      Access tokens -> Generate access token) and the matching SM_API_URL
#      (same Config tab), then add both as repo secrets/vars: SM_ACCESS_TOKEN
#      (secret) and SM_API_URL (variable).
# Without them this job fails, saying so; it never prints either token.
on:
  push:
    branches: [main]
    paths:
      - 'infra/monitoring/grafana/cloud/synthetic-monitoring.json'
      - 'tools/scripts/observability/apply-synthetic-monitoring.mjs'
      - '.github/workflows/synthetic-monitoring.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only validate the config and resolve probe names'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: synthetic-monitoring
  cancel-in-progress: false

jobs:
  apply:
    name: Apply Synthetic Monitoring check + alert rule
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            infra/monitoring/grafana/cloud
            tools/scripts/observability
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply
        env:
          SM_API_URL: ${{ vars.SM_API_URL }}
          SM_ACCESS_TOKEN: ${{ secrets.SM_ACCESS_TOKEN }}
          GRAFANA_URL: https://graysushi1880.grafana.net
          GRAFANA_SA_TOKEN: ${{ secrets.GRAFANA_SA_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: node tools/scripts/observability/apply-synthetic-monitoring.mjs $DRY_RUN
