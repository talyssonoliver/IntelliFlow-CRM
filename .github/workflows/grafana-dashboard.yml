name: Grafana Dashboard

# Applies infra/monitoring/grafana/cloud/dashboard-production.json (the
# production service dashboard, uid env008-production) to the Grafana Cloud
# stack (ENV-008-AI, ADR-087). The JSON is the source of truth; this job only
# pushes it. Runs on merge when the dashboard, its script, the shared Grafana
# client or this file change, or by hand. Its own workflow, so editing the
# dashboard never re-applies the alert rules or the SLOs.
#
# Needs GRAFANA_SA_TOKEN as a secret of the Production environment (the same
# one grafana-alert-rules.yml uses). Without it the job fails, saying so; it
# never prints the token. "dry_run" only reads whether the dashboard exists.
on:
  push:
    branches: [main]
    paths:
      - 'infra/monitoring/grafana/cloud/dashboard-production.json'
      - 'tools/scripts/observability/apply-grafana-dashboard.mjs'
      - 'tools/scripts/lib/grafana-provisioning.mjs'
      - '.github/workflows/grafana-dashboard.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only validate the dashboard and report whether it exists'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: grafana-dashboard
  cancel-in-progress: false

jobs:
  dashboard:
    name: Apply the production dashboard to Grafana Cloud
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            infra/monitoring/grafana/cloud
            tools/scripts/observability
            tools/scripts/lib
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply
        env:
          GRAFANA_URL: https://graysushi1880.grafana.net
          GRAFANA_SA_TOKEN: ${{ secrets.GRAFANA_SA_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: node tools/scripts/observability/apply-grafana-dashboard.mjs $DRY_RUN
