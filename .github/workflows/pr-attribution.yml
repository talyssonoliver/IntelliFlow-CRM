name: PR Attribution

# Repo policy: AI assistance is a tool, not a co-author. Commit messages have
# been checked for this since the audit linter landed, but PR text never was:
# #754 carried a "Generated with Claude Code" footer and a Claude session link
# in its body with every check green. This runs the SAME rule
# (tools/audit/commit_msg_lint.py --pr-text-file) over the PR title and body.
#
# Its own workflow, not a step in pr-checks.yml, so it can re-run on `edited`
# (a body changed after opening) without re-running pr-checks' heavier jobs.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: pr-attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-attribution:
    name: PR has no AI attribution
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      # The linter comes from the BASE branch, not the PR: a PR must not be able
      # to weaken the rule that judges its own text. Only the linter is needed;
      # commit_msg_lint.py uses the stdlib alone (widen the path if that changes).
      - name: Check out the base branch's linter
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: tools/audit
          path: base
      # Bootstrap only: until a base branch carries --pr-text-file (i.e. before
      # the PR that introduced it merges), fall back to the PR's copy, loudly.
      - name: Check out the PR's linter (bootstrap fallback)
        uses: actions/checkout@v7
        with:
          sparse-checkout: tools/audit
          path: head
      - name: Check PR title and body
        # Title and body arrive via env, never interpolated into the script, so
        # PR content cannot inject shell.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s\n\n%s\n' "${PR_TITLE:-}" "${PR_BODY:-}" > "$RUNNER_TEMP/pr-text.md"
          linter=base/tools/audit/commit_msg_lint.py
          if ! grep -q -- '--pr-text-file' "$linter"; then
            echo "::warning::Base branch linter predates --pr-text-file; using the PR's copy (bootstrap)."
            linter=head/tools/audit/commit_msg_lint.py
          fi
          python3 "$linter" --pr-text-file "$RUNNER_TEMP/pr-text.md"
