name: PR Attribution

# Repo policy: AI assistance is a tool, not a co-author. Commit messages have
# been checked for this since the audit linter landed, but PR text never was:
# #754 carried an AI-tool footer and a session link in its body with every
# check green. This runs the SAME rule (tools/audit/commit_msg_lint.py
# --pr-text-file) over the PR title and body.
#
# pull_request_target, deliberately: the workflow definition AND the linter come
# from the BASE branch, so a PR cannot rewrite this file or weaken the linter to
# pass its own check (with plain pull_request the PR's copy of this workflow
# would run). This is safe here because no PR code is ever checked out or run:
# the only PR input is the title/body, passed through env and written to a file.
# Read-only token, no secrets.
#
# Its own workflow, not a step in pr-checks.yml, so it can re-run on `edited`
# (a body changed after opening) without re-running pr-checks' heavier jobs.
# The first PR that adds this file is not checked by it (the base has no copy
# yet); every later PR is.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: pr-attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-attribution:
    name: PR has no AI attribution
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      # BASE branch only (the default ref for pull_request_target). Only the
      # linter is needed; commit_msg_lint.py uses the stdlib alone (widen the
      # sparse path if that changes).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: tools/audit
          persist-credentials: false
      - name: Check PR title and body
        # Title and body arrive via env, never interpolated into the script, so
        # PR content cannot inject shell.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s\n\n%s\n' "${PR_TITLE:-}" "${PR_BODY:-}" > "$RUNNER_TEMP/pr-text.md"
          python3 tools/audit/commit_msg_lint.py --pr-text-file "$RUNNER_TEMP/pr-text.md"
