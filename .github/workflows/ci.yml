name: CI Pipeline

on:
  push:
    branches: [main, develop]
    # CI-Audit P1 (2026-06-04): doc/metric-only pushes to main/develop don't need
    # the full sharded suite. This is on the PUSH trigger ONLY — `pull_request`
    # intentionally has no paths-ignore, so PR *required* checks always report
    # (avoids the "skipped required check blocks merge" footgun).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'artifacts/**'
      - '.specify/**'
      - 'apps/project-tracker/docs/metrics/**'
  pull_request:
    branches: [main, develop]
  # Merge Queue: run on the temporary merge ref so the required checks
  # (Architecture Tests, Build, Integration Tests, Lint & Format,
  # Sprint Plan Validation, Type Check) report on the queue's ref.
  # E2E is gated push+main only below and is NOT a required check —
  # it is skipped cleanly on merge_group refs.
  merge_group:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'
  # TURBO_TOKEN reuses VERCEL_TOKEN (both are Vercel-issued tokens and the
  # Turborepo remote cache API accepts a Vercel token). TURBO_TEAM must be
  # set by the operator as a repo variable (the Vercel team slug, e.g.
  # "talyssonoliver"). See PR body for setup instructions.
  TURBO_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # ==========================================
  # PR scope detection. Decides, per pull request, how much of the pipeline has
  # to run: the changed workspace packages plus everything that depends on them
  # (mode=affected), nothing for docs-only diffs (mode=none), or everything
  # (mode=full) for root config, lockfile, turbo.json, tsconfig base, .github/
  # and any non-PR event. Push to main, merge_group and the nightly always run
  # in full.
  #
  # FAIL-SAFE: every consumer below treats an empty output as "full". If this
  # job fails, the jobs that need it still run (`!cancelled()`) and run the
  # whole suite. Required checks are never skipped because detection broke.
  # ==========================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      code: ${{ steps.detect.outputs.code }}
      unit: ${{ steps.detect.outputs.unit }}
      integration: ${{ steps.detect.outputs.integration }}
      web: ${{ steps.detect.outputs.web }}
      shards: ${{ steps.detect.outputs.shards }}
      shard_total: ${{ steps.detect.outputs.shard_total }}
      turbo_filter: ${{ steps.detect.outputs.turbo_filter }}
      test_paths: ${{ steps.detect.outputs.test_paths }}
    steps:
      - uses: actions/checkout@v7
        with:
          # pull_request checks out the merge commit: HEAD^1 is the base tip and
          # HEAD^2 the PR head, so depth 3 covers both diff modes below.
          fetch-depth: 3
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Classify changed paths
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          # pr          = everything the PR changes against its base (default)
          # last-commit = only the PR head's last commit. Used to prove the
          #               fast paths on a PR that itself edits .github/.
          DIFF_MODE: pr
        run: |
          if [ "$DIFF_MODE" = "last-commit" ]; then base=HEAD^2^1; head=HEAD^2; else base=HEAD^1; head=HEAD; fi
          node scripts/ci/affected.mjs --event "$EVENT" --base "$base" --head "$head"

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: [changes]
    # Always runs (also for docs-only PRs, which still get a format check).
    if: ${{ !cancelled() }}
    env:
      SCOPE_MODE: ${{ needs.changes.outputs.mode }}
      TURBO_FILTER: ${{ needs.changes.outputs.turbo_filter }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # Empty SCOPE_MODE (detection failed) falls through to the full run.
      - name: Lint
        if: needs.changes.outputs.code != 'false'
        run: |
          if [ "$SCOPE_MODE" = "affected" ]; then
            if [ -z "$TURBO_FILTER" ]; then echo "No workspace package affected; nothing for turbo to lint."; exit 0; fi
            pnpm exec turbo run lint $TURBO_FILTER
          else
            pnpm run lint
          fi

      - name: Format check
        run: |
          if [ "$SCOPE_MODE" = "affected" ] || [ "$SCOPE_MODE" = "none" ]; then
            # Same globs as `format:check`, restricted to the files this PR
            # touches. A config change that could reformat other files is a
            # root-level path, which forces SCOPE_MODE=full.
            git diff --name-only --diff-filter=ACMR HEAD^1 HEAD \
              | grep -E '\.(ts|tsx|md|json|yml|yaml)$' > /tmp/format-files.txt || true
            if [ ! -s /tmp/format-files.txt ]; then echo "No formattable files changed."; exit 0; fi
            xargs -d '\n' pnpm exec prettier --check --ignore-unknown < /tmp/format-files.txt
          else
            pnpm run format:check
          fi

      # D3: assert every `FROM node:<major>` in the Dockerfiles matches .nvmrc.
      # Catches the boot-outage class (2026-06-03) where a Dockerfile node major
      # drifted from the runtime Node the app needs — passes build, crashes boot.
      - name: Dockerfile Node version guard
        if: needs.changes.outputs.code != 'false'
        run: pnpm run check:dockerfile-node

      # Folded in from the removed `PR Checks / Quality Checks` job
      # (Recommendation E of docs/operations/ci-cost-audit-2026-05-25.md) so a11y route
      # reconciliation is still enforced after deduplication. lint:artifacts
      # was continue-on-error so its removal is intentional and accepted.
      - name: A11y route reconciliation
        if: needs.changes.outputs.code != 'false'
        run: pnpm run validate:a11y-routes
        env:
          VALIDATION_STRICT: '1'

      # ENG-OPS-002.R13 / QUAL-012: ADR-054 flaky-test policy enforcement.
      # Fails when a test.skip/it.skip/describe.skip/xit/xdescribe/xtest lacks
      # an approved `// ADR-054: <reference>` annotation or allowlist entry.
      # Mirrors scripts/pre-ship.mjs's `flaky-test-gate` step.
      - name: Flaky-test skip gate (ADR-054)
        if: needs.changes.outputs.code != 'false'
        run: pnpm run validate:flaky-test-gate

      # Proves the gate itself is correct (detection + reconciliation +
      # false-positive guardrails). Build-free via the dedicated config;
      # enforces the ≥90% AC.
      - name: Flaky-test skip gate tests
        if: needs.changes.outputs.code != 'false'
        run: pnpm run test:flaky-test-gate

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: [changes]
    # Skipped (= passed) only when detection succeeded and found no code change.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    env:
      SCOPE_MODE: ${{ needs.changes.outputs.mode }}
      TURBO_FILTER: ${{ needs.changes.outputs.turbo_filter }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          build-libs: 'true'

      - name: Type check
        run: |
          if [ "$SCOPE_MODE" = "affected" ]; then
            if [ -n "$TURBO_FILTER" ]; then pnpm exec turbo run typecheck $TURBO_FILTER; else echo "No workspace package affected; skipping turbo typecheck."; fi
            pnpm run lint:sonar:guard
          else
            pnpm run typecheck
          fi

  # Full ~30k-test suite, sharded 20 ways and merged into one coverage gate.
  # Replaces the old single-runner `pnpm run test -- --coverage` — which also
  # ran a SECOND time in pr-checks.yml (test-coverage) and a THIRD time in
  # sonar.yml. The reusable workflow owns the whole flow: 20 shards -> merge
  # (90/80/90/90 threshold gate) -> Codecov + PR comment -> SonarCloud (from the
  # merged lcov) -> shard-balance. See ADR-057/058 and test-regression.yml.
  test:
    name: Unit Tests (sharded)
    needs: [changes]
    # Never skipped: the required Merge Coverage Gate / SonarCloud Scan contexts
    # live inside this reusable workflow, which scales itself from the inputs.
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/test-regression.yml
    with:
      mode: ${{ needs.changes.outputs.mode }}
      unit: ${{ needs.changes.outputs.unit }}
      shards: ${{ needs.changes.outputs.shards }}
      shard_total: ${{ needs.changes.outputs.shard_total }}
      test_paths: ${{ needs.changes.outputs.test_paths }}
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write

  # ==========================================
  # IFC-131: Architecture Boundary Enforcement
  # ==========================================
  architecture:
    name: Architecture Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Install architecture test dependencies
        run: cd tests/architecture && pnpm install --frozen-lockfile
        continue-on-error: true

      - name: Run architecture boundary tests
        run: cd tests/architecture && pnpm test
        id: arch-tests

      - name: Architecture boundary check summary
        if: always()
        run: |
          echo "## Architecture Boundary Enforcement" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Hexagonal Architecture Rules (IFC-131)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Layer | Can Depend On | Cannot Depend On |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------------|------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Domain | (none) | Application, Adapters, Infrastructure |" >> $GITHUB_STEP_SUMMARY
          echo "| Application | Domain | Adapters, Infrastructure |" >> $GITHUB_STEP_SUMMARY
          echo "| Adapters | Domain, Application | (none - outer layer) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.arch-tests.outcome }}" == "success" ]; then
            echo ":white_check_mark: **All architecture boundary tests passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo ":x: **Architecture boundary violations detected!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please review the test output for details on which imports violate hexagonal architecture rules." >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================
  # Integration Tests with Database Services
  # ==========================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.integration != 'false' }}
    # Independent of the unit shards (own Postgres/Redis services) — runs in
    # parallel with the sharded suite rather than after it, for faster feedback.
    services:
      postgres:
        # pgvector image so the baseline migration's `CREATE EXTENSION vector`
        # works during integration test setup. Vanilla postgres:15-alpine
        # doesn't ship pgvector binaries.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: intelliflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/intelliflow_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          build-libs: 'true'

      - name: Bootstrap Supabase schemas + roles
        run: |
          PGPASSWORD=${{ secrets.CI_POSTGRES_PASSWORD }} psql -h localhost -U postgres -d intelliflow_test -v ON_ERROR_STOP=1 <<'SQL'
            CREATE SCHEMA IF NOT EXISTS extensions;
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
                CREATE ROLE anon NOLOGIN;
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
                CREATE ROLE authenticated NOLOGIN;
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
                CREATE ROLE service_role NOLOGIN BYPASSRLS;
              END IF;
            END
            $$;
            GRANT USAGE ON SCHEMA extensions TO postgres, anon, authenticated, service_role;
          SQL

      - name: Setup database
        run: |
          pnpm --filter @intelliflow/db db:push
        env:
          DATABASE_URL: postgresql://postgres:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/intelliflow_test

      # Emit the per-test JSON alongside the normal console output so the
      # silent-skip gate below has something to audit. This job is NOT sharded,
      # so it sees the whole integration project and no file-subset problem
      # arises (the 20-way unit matrix is deliberately not wired to this gate).
      # The RUN_ID marker pins the manifest to this commit; the gate refuses to
      # reconcile against a run it cannot tie to HEAD.
      - name: Run integration tests
        run: |
          mkdir -p artifacts/coverage-parts/integration
          printf '{"headSha":"%s","startedAt":"%s"}\n' \
            "$(git rev-parse HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > artifacts/coverage-parts/RUN_ID.json
          # Invoke vitest directly rather than `pnpm run test:integration -- <flags>`:
          # pnpm forwards the `--` verbatim, so vitest received
          # `run --project integration -- --reporter=json ...` and treated the
          # flags as positional test-name filters. The suite still ran, the
          # reporters were silently ignored, and no manifest was written — which
          # the gate then (correctly) refused to certify.
          pnpm exec vitest run --project integration \
            --reporter=default --reporter=json \
            --outputFile.json=artifacts/coverage-parts/integration/vitest-result.json
        env:
          DATABASE_URL: postgresql://postgres:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/intelliflow_test
          REDIS_URL: redis://localhost:6379

      # Fails when a suite executed 0 of N collected tests without a declaration
      # in tools/scripts/infra-skip-gate.registry.json, and writes a per-file
      # executed/skipped table to the job summary so a skip is visible even when
      # the gate passes. `if: always()` so a red test run still reports WHY the
      # suite was empty rather than hiding it behind the earlier failure.
      - name: Silent-skip gate (#658)
        if: always()
        run: pnpm run validate:infra-skip-gate

      - name: Upload integration test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: integration-test-report
          path: |
            artifacts/coverage/
            artifacts/reports/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    # No longer waits for lint + typecheck: that serialised ~4 min of static
    # checks in front of the build on every PR. Branch protection requires Lint,
    # Type Check and Build independently, so a red lint still blocks the merge.
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    env:
      SCOPE_MODE: ${{ needs.changes.outputs.mode }}
      TURBO_FILTER: ${{ needs.changes.outputs.turbo_filter }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # PG-195: enforce glyph-audit coverage before the production build so
      # a new unlisted icon cannot ship as tofu (also enforced on PRs via
      # pr-checks.yml > Quality Checks).
      - name: Audit Material Symbols glyph coverage
        if: needs.changes.outputs.web != 'false'
        run: pnpm --filter @intelliflow/web audit:material-symbols

      - name: Build
        run: |
          if [ "$SCOPE_MODE" = "affected" ]; then
            if [ -z "$TURBO_FILTER" ]; then echo "No workspace package affected; nothing to build."; exit 0; fi
            pnpm exec turbo run build $TURBO_FILTER
          else
            pnpm run build
          fi
        env:
          NODE_ENV: production
          # All module-load guards must be satisfied or `next build` fails
          # at page-data collection. See pr-checks.yml > Build Preview for
          # the full rationale; mirror that env block here.
          PRISMA_FIELD_ENCRYPTION_KEY: ${{ secrets.PRISMA_FIELD_ENCRYPTION_KEY || 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' }}
          AI_AUDIT_SIGNING_KEY: ${{ secrets.AI_AUDIT_SIGNING_KEY || 'ci-build-stub-key-not-used-at-runtime' }}
          DATABASE_URL: ${{ format('postgresql://{0}:{0}@localhost:5432/stub', 'stub') }}
          DIRECT_URL: ${{ format('postgresql://{0}:{0}@localhost:5432/stub', 'stub') }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://stub.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'ci-stub-anon-not-a-real-supabase-key-do-not-use-at-runtime' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'ci-stub-service-role-not-a-real-supabase-key-do-not-use-at-runtime' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://stub.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-stub-anon-not-a-real-supabase-key-do-not-use-at-runtime' }}

      - name: Upload build artifacts
        if: needs.changes.outputs.mode != 'none'
        # actions/upload-artifact@v4+ changed defaults: include-hidden-files
        # is now false, which filters out anything under a dot-prefixed dir.
        # `apps/*/.next` matches the directory NAME via the glob, but the
        # hidden-file filter then drops every file inside it because the
        # path component starts with '.' — so apps/web/.next never reaches
        # the artifact. Net effect on main 13990287d: artifact contained
        # apps/api/dist + apps/ai-worker/dist (250 files, 1.7MB) but ZERO
        # web content; E2E's Verify-.next step then fired.
        # Setting include-hidden-files: true restores the v3 behaviour and
        # captures .next as intended.
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            apps/*/dist
            apps/*/.next
          include-hidden-files: true
          retention-days: 7

  # `security-scan` was removed as part of Recommendation E of
  # docs/operations/ci-cost-audit-2026-05-25.md. It duplicated coverage
  # already provided by .github/workflows/security.yml:
  #   - `pnpm audit --audit-level=high` (continue-on-error) → security.yml
  #     `npm-audit` (`pnpm audit --audit-level=critical`, the policy set by
  #     the security team)
  #   - `trufflesecurity/trufflehog` → security.yml `secret-scanning`
  #     (gitleaks) plus the CodeQL + Trivy + OWASP Dependency-Check
  #     coverage in the same workflow.
  #
  # EXTERNAL PRE-MERGE REQUIREMENT: branch protection lives outside this
  # repo and is not updated by merging this file. Before this PR can land,
  # a repo admin must PATCH the required_status_checks set to remove the
  # now-orphan context `CI Pipeline / Security Scan` — see the PR
  # description for the exact `gh api` command.

  plan-lint:
    name: Sprint Plan Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/plan/pyproject.toml

      - name: Install plan-lint dependencies
        run: |
          cd tools/plan
          pip install -e ".[dev]"

      - name: Run plan linter (Sprint 0)
        run: |
          cd tools/plan
          python -m src.adapters.cli lint --sprint 0 --verbose

      - name: Run plan lint tests
        run: |
          cd tools/plan
          python -m pytest tests/ -v --tb=short

      - name: Upload lint reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plan-lint-report
          path: |
            apps/project-tracker/docs/metrics/review-queue.json
            artifacts/reports/plan-lint-report.json
          retention-days: 30

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # merge_group refs are not 'refs/heads/main', so this job is naturally
    # skipped on merge queue runs without extra gating needed.
    # On main this job runs ONLY the smoke suite (tests/e2e/smoke.spec.ts) —
    # fast, no-backend-required critical-path checks (homepage, login form,
    # /api/health, responsive). It is a REAL signal: continue-on-error is
    # removed so a broken smoke path turns the check-run red instead of
    # silently green. The full 20-spec E2E suite (129 currently-failing
    # data/auth specs that need a live backend) moved to the dedicated
    # e2e-full.yml workflow (scheduled + manual), so the visible main check
    # surface is no longer permanently red. Re-fold specs into smoke as they
    # are made backend-independent / fixed. Tracked at GH issue #95.
    # Job-level env mirrors the Build job's env block — `next start` against
    # the downloaded production .next loads the same module-init guards as
    # `next build` did, so any required env var the build had stubbed must
    # also be stubbed here. Most recently: M4 PRISMA_FIELD_ENCRYPTION_KEY
    # guard crashed `next start` at boot until added (run 26619960490).
    env:
      PRISMA_FIELD_ENCRYPTION_KEY: ${{ secrets.PRISMA_FIELD_ENCRYPTION_KEY || 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=' }}
      AI_AUDIT_SIGNING_KEY: ${{ secrets.AI_AUDIT_SIGNING_KEY || 'ci-build-stub-key-not-used-at-runtime' }}
      DATABASE_URL: ${{ format('postgresql://{0}:{0}@localhost:5432/stub', 'stub') }}
      DIRECT_URL: ${{ format('postgresql://{0}:{0}@localhost:5432/stub', 'stub') }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://stub.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'ci-stub-anon-not-a-real-supabase-key-do-not-use-at-runtime' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'ci-stub-service-role-not-a-real-supabase-key-do-not-use-at-runtime' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://stub.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-stub-anon-not-a-real-supabase-key-do-not-use-at-runtime' }}
      # #228 fail-fast: `next start` boots in production mode, so every now-required
      # URL/host must be present or the app refuses to start. These are throwaway
      # CI stubs (Redis degrades gracefully; OTel is disabled here).
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      OTEL_ENABLED: 'false'
      APP_URL: https://stub.example.com
      NEXT_PUBLIC_APP_URL: https://stub.example.com
      OLLAMA_BASE_URL: http://localhost:11434
      LITELLM_BASE_URL: http://localhost:4000/v1
      VAULT_ADDR: http://localhost:8200
      TEMPORAL_ADDRESS: localhost:7233
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-monorepo
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # F-09 / ADR-059: cache the browser download so repeat e2e runs skip the
      # ~1-2 min `playwright install`. Keyed by the resolved @playwright/test
      # version so a Playwright bump invalidates it deterministically.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Download build artifacts
        # actions/upload-artifact@v7 strips the common ancestor of all
        # matched paths from the artifact archive. For us, the upload
        # patterns were `apps/*/dist` and `apps/*/.next`, common ancestor
        # `apps/`, so internal artifact layout is e.g. `web/.next/...`
        # (not `apps/web/.next/...`). Verified by `gh run download` of the
        # build-output artifact from run 26616704326 (PR #203 merge).
        #
        # Two earlier attempts at this step:
        #   - PR #197: no `path:` -> v4 default puts everything under
        #     `build-output/web/.next/...`. Wrong.
        #   - PR #201: `path: .` -> contents land at `./web/.next/...`.
        #     Still wrong: webServer runs from apps/web/ which is the
        #     git-checkout copy without a .next.
        # This: `path: apps` extracts artifact contents under `apps/`,
        # so internal `web/.next` becomes `apps/web/.next` -- exactly
        # what webServer expects.
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: apps

      - name: Verify .next was downloaded
        # Belt-and-suspenders: surface the underlying failure mode if the
        # artifact ever drifts again. `next start` would otherwise crash
        # ~250ms in with a generic "Could not find a production build" error
        # that doesn't point at this step.
        run: |
          if [ ! -d "apps/web/.next" ]; then
            echo "::error::apps/web/.next missing after download-artifact step."
            echo "::error::Expected upload from build job (path: apps/*/dist + apps/*/.next, include-hidden-files: true)."
            echo "::error::Expected download in this job (path: apps so the upload's ancestor-stripped layout lands under apps/)."
            echo "::error::Working dir listing (apps/web):"
            ls -la apps/web/ || true
            echo "::error::Workspace top-level for stray artifact-name drops:"
            ls -la . | head -30 || true
            exit 1
          fi
          echo "apps/web/.next present ($(du -sh apps/web/.next | cut -f1))"

      - name: Run E2E tests
        # Scope to the chromium project to match the chromium-only install
        # above. playwright.config.ts defines 6 projects (chromium, firefox,
        # webkit, mobile-chrome, mobile-safari, tablet); firefox/webkit/
        # mobile-safari/tablet need browser engines we do NOT install here.
        # smoke.spec.ts is the fast critical-path set; backend-dependent
        # assertions inside it already self-skip without E2E_AUTH_ENABLED.
        # The full suite runs in e2e-full.yml (scheduled + manual).
        #
        # SELECT BY TITLE, NOT BY POSITIONAL PATH. The previous invocation
        # `playwright test --project=chromium tests/e2e/smoke.spec.ts` matched
        # all 16 tests in every local run (PW 1.60) but resolved to ZERO on the
        # ubuntu runner — "No tests found" AFTER globalSetup — a platform-specific
        # positional-file-path-regex resolution gap that kept this job red for
        # weeks with no real E2E signal. `--grep "Smoke Tests"` matches the
        # top-level describe title (unique to smoke.spec.ts) and is independent
        # of how Playwright resolves file paths across OSes. The --list guard
        # fails LOUD with cwd + full discovery if the count is ever 0 again,
        # so a regression is diagnosable in one run instead of a bare error.
        run: |
          echo "cwd=$(pwd)"
          echo "PW_VERSION=$(node -e "console.log(require('@playwright/test/package.json').version)")"
          echo "--- ls -la tests/e2e (first 30) ---"
          ls -la tests/e2e/ 2>&1 | head -30 || echo "tests/e2e NOT LISTABLE"
          echo "--- find *.spec.ts under tests/ ---"
          find tests -name '*.spec.ts' 2>/dev/null | head -20 || true
          echo "--- realpath tests/e2e ---"
          realpath tests/e2e 2>&1 || true
          echo "--- UNFILTERED discovery (all projects) ---"
          pnpm exec playwright test --list 2>&1 | tail -12 || true
          echo "--- chromium + grep discovery ---"
          pnpm exec playwright test --project=smoke --list 2>&1 | tee /tmp/pwlist.txt | tail -6 || true
          count=$(grep -cE "smoke\.spec\.ts:[0-9]+" /tmp/pwlist.txt || true)
          if [ "${count:-0}" -eq 0 ]; then
            echo "::error::Playwright discovered 0 smoke tests for the chromium project (see diagnostics above)."
            exit 1
          fi
          echo "Discovered $count smoke tests — running."
          pnpm exec playwright test --project=smoke

      - name: Upload E2E results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
