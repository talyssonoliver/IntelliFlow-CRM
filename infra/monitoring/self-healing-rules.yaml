# IntelliFlow CRM - production self-healing (ENV-008-AI, ADR-087)
#
# A DESCRIPTIVE RECORD. No system reads this file. It says what self-healing
# exists in production and where it is really set. The values below are a copy
# of DESIRED in the script named in source_of_truth; a test
# (tools/scripts/__tests__/env008-monitoring-content.test.ts) keeps them equal.
#
# The Sprint-0 operator playbooks that lived here were never wired to anything
# and are gone. Self-healing is now two Railway settings, applied by CI on merge
# (owner ruling 2, 2026-10-22).

version: 2
taskId: ENV-008-AI
mode: descriptive
applied_by: .github/workflows/railway-self-healing.yml
source_of_truth: tools/scripts/observability/apply-railway-self-healing.mjs (DESIRED)
platform: Railway (production environment)

services:
  api:
    restartPolicyType: ON_FAILURE
    restartPolicyMaxRetries: 10
    healthcheckPath: /api/health/live
    healthcheckTimeout: 120
  combined-worker:
    restartPolicyType: ON_FAILURE
    restartPolicyMaxRetries: 10
    healthcheckPath: /health
  ai-worker:
    restartPolicyType: ON_FAILURE
    restartPolicyMaxRetries: 10

conditions:
  - 'combined-worker has run the ai, events and ingestion workers in one process since 2026-10-25. Its /health check is set only when it serves health on PORT (no COMBINED_HEALTH_PORT or HEALTH_PORT, or one equal to PORT); a value Railway already has is left alone.'
  - 'ai-worker, events-worker and ingestion-worker are stopped since that cutover. ai-worker keeps its settings while the service exists and is skipped once it is gone; events-worker and ingestion-worker are never touched.'
  - 'ai-worker also gets healthcheckPath /health/live, but only when its PORT equals its HEALTH_PORT (default 5000). Railway probes PORT, and ai-worker serves health on HEALTH_PORT.'
  - "The api health check is set only after the live api answers 200 on /api/health/live, probed on the api service's own Railway host (EXPECTED_API_HOST in the script); a PRODUCTION_API_URL naming any other host is refused. If the probe fails or is refused, the restart policy is still set and the CI run fails."
  - 'An unreadable variables answer (auth or API error) fails the run; a port guard never passes on a guess.'

limits:
  - 'Restart is crash-only: ON_FAILURE restarts a process that exits with an error, not one that hangs.'
  - 'The health check is a deploy gate, not a liveness probe: Railway checks it when a deployment starts, then stops checking.'
  - 'Changed settings take effect from the next deployment; the CI job never deploys or redeploys.'
  - 'ws and notifications-worker are not covered (EP-001-AI).'

drift_check: 'Run .github/workflows/railway-self-healing.yml by hand without "apply" after any change made in the Railway dashboard; it prints before and after for every setting and changes nothing.'
see_also:
  - docs/architecture/adr/ADR-087-production-slos-anomaly-detection-and-self-healing.md
